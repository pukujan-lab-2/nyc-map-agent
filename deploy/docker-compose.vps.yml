# nyc-map-agent on the VPS: the app with OpenTripPlanner for trips, Valhalla for walking routes and
# LFM3 for chat. MOTIS stays one more week as a fallback (TRIP_PLANNER=motis). See deploy/README.md.
# The app binds loopback on 127.0.0.1:18088 and joins study-os_edge, where Cloudflare tunnel A
# reaches it as nyc-map-web:8080. Komodo deploys it (deploy/vps/autodeploy.sh).
# LFM3 runs on the MacBook Pro (the tax demo's llama-server). The Pro holds an SSH reverse tunnel to
# this host's 127.0.0.1:18099 (launchd com.pukujan.lfm3-tunnel), and lfm3-bridge re-offers it on the
# Docker gateway, because containers cannot reach the host's loopback.
name: nyc-map-agent

services:
  web:
    container_name: nyc-map-web
    image: ${NYC_MAP_IMAGE:-nyc-map-agent:local}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_DATA_BACKEND: ${VITE_DATA_BACKEND:-octo}
        MAPILLARY_TOKEN: ${MAPILLARY_TOKEN:-}
    restart: unless-stopped
    env_file:
      - path: ${NYC_MAP_ENV_FILE:-../../nyc-map-agent.env}
        required: false
    environment:
      PORT: "8080"
      OTP_URL: http://nyc-map-otp:8080
      VALHALLA_URL: http://nyc-map-valhalla:8002
      MOTIS_URL: http://nyc-map-motis:8080
      INFERHUB_BASE_URL: ${INFERHUB_BASE_URL:-http://host.docker.internal:18099/v1}
      INFERHUB_MODEL: ${INFERHUB_MODEL:-lfm3}
      # llama-server takes no key, but the route refuses to start without one.
      INFERHUB_API_KEY: ${INFERHUB_API_KEY:-local}
      INFERHUB_MODEL_FALLBACKS: ${INFERHUB_MODEL_FALLBACKS:-}
      # The VPS's one Sablier (server-management komodo/resources/platform.toml): the app wakes
      # otp and valhalla through it, and they sleep after 10 idle minutes (#44).
      SABLIER_URL: http://sablier:10000
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:18088:8080
    # edge: Cloudflare tunnel A (octo-cloudflared) reaches the app as nyc-map-web:8080.
    # sablier: the shared network where http://sablier:10000 answers.
    networks: [default, edge, sablier]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Graph from deploy/otp/build-graph.sh (weekly; it restarts this container). otp.env holds only
  # MTA_BUSTIME_KEY, which router-config.json reads for live bus times; the build writes it.
  # Sleeps after 10 idle minutes; the app wakes it (server/features/agent/sablier.ts, #44).
  otp:
    container_name: nyc-map-otp
    image: ${OTP_IMAGE:-opentripplanner/opentripplanner:2.10.0}
    command: ["--load", "--serve"]
    restart: unless-stopped
    labels:
      sablier.enable: "true"
      sablier.group: nyc-map
    # Healthy once /otp/ answers, which is after the graph has loaded. Sablier holds a wake until
    # then. The image has no curl, so bash asks over /dev/tcp.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /otp/ HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s
    env_file:
      - path: ${OTP_ROOT:-/home/ubuntu/apps/nyc-map-otp}/otp.env
        required: false
    environment:
      JAVA_TOOL_OPTIONS: -Xmx7g -XX:+UseG1GC
    mem_limit: 9g
    volumes:
      - ${OTP_ROOT:-/home/ubuntu/apps/nyc-map-otp}/graph:/var/opentripplanner
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Tiles from deploy/valhalla/build.sh (weekly; it restarts this container). Serves only.
  # Sleeps after 10 idle minutes like otp, and starts in about a second.
  valhalla:
    container_name: nyc-map-valhalla
    image: ghcr.io/valhalla/valhalla-scripted:3.9.1
    restart: unless-stopped
    labels:
      sablier.enable: "true"
      sablier.group: nyc-map
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8002/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    environment:
      serve_tiles: "True"
      use_tiles_ignore_pbf: "True"
    mem_limit: 1g
    volumes:
      - ${VALHALLA_ROOT:-/home/ubuntu/apps/nyc-map-valhalla}:/custom_files
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Data from deploy/motis/build.sh. The fallback planner until 2026-11-08; then remove it.
  motis:
    container_name: nyc-map-motis
    image: debian:13-slim
    command: ["/motis/bin/motis", "server"]
    working_dir: /motis
    restart: unless-stopped
    mem_limit: 2g
    volumes:
      - ${MOTIS_ROOT:-/home/ubuntu/apps/nyc-map-motis}:/motis
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  lfm3-bridge:
    container_name: nyc-map-lfm3-bridge
    image: alpine/socat:1.8.0.3
    network_mode: host
    command: ["TCP-LISTEN:18099,bind=172.17.0.1,fork,reuseaddr,range=172.16.0.0/12", "TCP:127.0.0.1:18099"]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  edge:
    name: study-os_edge
    external: true
  # Created by server-management's `platform` stack, which Komodo deploys first.
  sablier:
    name: sablier
    external: true
